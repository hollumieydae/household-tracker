<html lang="en">
<head>

<title>Household Cash Flow</title>
<meta name="description" content="Track household income, expenses, savings goals, project funds and loans, synced between two people.">

<style>
:root{
  --ink:#14303A; --paper:#F3F6F5; --panel:#FFFFFF; --line:#D6DFDC; --muted:#587069;
  --income:#1E8C5A; --expense:#D2483F; --debt:#B7791F; --save:#3559C7; --fund:#7B4FC4; --inv:#0F8B8D; --left:#14303A;
  --focus:#3559C7; --shade:rgba(20,48,58,.05);
  --display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#E6EFEC; --paper:#0F1E22; --panel:#152A30; --line:#28414A; --muted:#93AAA4;
    --income:#4FC58A; --expense:#F0776E; --debt:#E0A94A; --save:#7C98F0; --fund:#B594F2; --inv:#4FD1C5; --left:#E6EFEC; --focus:#7C98F0; --shade:rgba(230,239,236,.06);}
}
:root{color-scheme:light dark}
*{box-sizing:border-box}
select,input,textarea{color:var(--ink)}
select{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
select option{background:var(--panel);color:var(--ink)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-.01em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--panel)}
.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px}
.brand{font:700 20px var(--display)}
.topright{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}

#monthlabel{min-width:150px;text-align:center;font:500 16px var(--display)}
#monthinput{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:5px 8px}
.syncchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:20px;padding:4px 12px;font-size:13px;cursor:pointer}
.syncchip .d{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.syncchip.ok .d{background:var(--income)} .syncchip.busy .d{background:var(--save)} .syncchip.warn .d{background:var(--debt)} .syncchip.bad .d{background:var(--expense)}
nav.tabs{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}

nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-current=page]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:24px 0 64px}
section.block{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
section.block>h2{font-size:18px;margin-bottom:14px}
.sub{color:var(--muted);font-size:13px;margin:-8px 0 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:20px}

details summary{cursor:pointer;color:var(--save);font-size:13px;margin-top:6px}
details.box{border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:12px}

svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--body)}
.note{background:var(--shade);border-radius:8px;padding:10px 14px;font-size:13.5px;margin:0 0 14px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.cols2{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:8px;padding:14px}
.card h3{font-size:16px;margin-bottom:6px}

.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

  <div class="wrap"><p class="hint" style="margin-top:8px">Version 11 · investments: treasury bills, stocks, land and more</p></div></main>

<script>
"use strict";
/* ================= Google settings ================= */
const G = {
  clientId: '365141986859-2jtjhgcatic44dmhimvld2mq3ih2nbbe.apps.googleusercontent.com',
  appId: '365141986859',                       // Google Cloud project number (needed by the file picker)
  scope: 'https://www.googleapis.com/auth/drive.file',
  fileName: 'household-cash-flow.json'
};
const GOOGLE_API_KEY = 'AIzaSyBaOzz7HRajrf-rmlsJ0ueju9_-SBUK6eQ';                    // Picker API key (restricted to this site). Can also be pasted in Setup & sync.

/* ================= State ================= */
const KEY = 'householdCashFlow.v1';
const COLS = ['income','expenses','goals','contribs','loans','payments','charges','funds','fundTx','investments','invtx'];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-3);
const defaults = () => ({
  v: 2, currency: '₦', earners: ['Me', 'Partner'], settingsU: 0, tomb: {}, invFlow: true,
  categories: [
    {name:'Rent & housing', budget:0}, {name:'Food & groceries', budget:0}, {name:'Utilities & data', budget:0},
    {name:'Transport', budget:0}, {name:'Health', budget:0}, {name:'Education', budget:0},
    {name:'Family & giving', budget:0}, {name:'Household supplies', budget:0}, {name:'Leisure', budget:0}, {name:'Other', budget:0}
  ],
  income: [], expenses: [], goals: [], contribs: [], loans: [], payments: [], charges: [], funds: [], fundTx: [], investments: [], invtx: []
});
function normalize(d){
  d = d && typeof d === 'object' ? d : {};
  const out = Object.assign(defaults(), d), t = Date.now();
  if(d.v !== 2){                                   // upgrade the first version's data shape
    out.contribs = []; out.payments = [];
    out.goals = (d.goals || []).map(g => {
      (g.contribs || []).forEach(c => out.contribs.push({id:c.id || uid(), goalId:g.id, date:c.date, amount:c.amount, u:t}));
      const rest = {...g}; delete rest.contribs; return {...rest, u:t};
    });
    out.loans = (d.debts || []).map(x => {
      (x.payments || []).forEach(p => out.payments.push({id:p.id || uid(), loanId:x.id, date:p.date, amount:p.amount, kind:'monthly', u:t}));
      return {id:x.id, name:x.name, original:x.start, monthly:x.minPay || 0, rate:x.rate || '', balance:x.start, asAt:'', u:t};
    });
    delete out.debts; out.v = 2;
  }
  COLS.forEach(c => { if(!Array.isArray(out[c])) out[c] = []; out[c].forEach(x => { if(!x.u) x.u = t; }); });
  if(!out.tomb || typeof out.tomb !== 'object') out.tomb = {};
  return out;
}
function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return normalize(JSON.parse(r)); }catch(e){}
  return defaults();
}
let S = load();
function saveLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Could not save in this browser. Download a backup from Setup & sync.'); }
}
function save(){ saveLocal(); scheduleSync(); }

const now = new Date();
const pad = n => String(n).padStart(2,'0');
const curMonth = now.getFullYear() + '-' + pad(now.getMonth()+1);
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
const ui = { tab:'overview', month:curMonth, year:now.getFullYear(), edit:null, catFilter:'', openKeys:new Set(), invType:'tbill' };

/* ================= Helpers ================= */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a, f) => a.reduce((t, x) => t + (Number(f(x)) || 0), 0);
const inMonth = (d, m) => typeof d === 'string' && d.startsWith(m);
function money(n){
  n = Number(n) || 0;
  const a = Math.abs(n), whole = Math.abs(a - Math.round(a)) < 0.005;
  return (n < 0 ? '−' : '') + S.currency + (whole ? Math.round(a) : a).toLocaleString('en-US', {minimumFractionDigits: whole ? 0 : 2, maximumFractionDigits: 2});
}
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
function monthName(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo-1, 1).toLocaleString('en-GB', {month:'long', year:'numeric'}); }
const shortMonth = i => new Date(2000, i, 1).toLocaleString('en-GB', {month:'short'});
function shiftMonth(m, d){ const [y,mo] = m.split('-').map(Number); const dt = new Date(y, mo-1+d, 1); return dt.getFullYear() + '-' + pad(dt.getMonth()+1); }
function lastDay(m){ const [y,mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
const defDate = () => ui.month === curMonth ? todayStr() : ui.month + '-01';
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200); }
function fmtDate(d){ if(!d) return ''; const [y,m,dd] = d.split('-').map(Number); return new Date(y, m-1, dd).toLocaleDateString('en-GB', {day:'numeric', month:'short', year: y !== now.getFullYear() ? 'numeric' : undefined}); }
const goalSaved = g => (Number(g.start) || 0) + sum(S.contribs.filter(c => c.goalId === g.id), c => c.amount);
const fundIn  = f => sum(S.fundTx.filter(t => t.fundId === f.id && t.kind === 'in'),  t => t.amount);
const fundOut = f => sum(S.fundTx.filter(t => t.fundId === f.id && t.kind === 'out'), t => t.amount);
/* An entry counts against the confirmed balance if it is dated after the "as at" day, or dated the same day
   but logged after the balance was set (bu = when the balance was last set). */
const afterBase = (l, x) => !l.asAt || x.date > l.asAt || (x.date === l.asAt && (x.u || 0) > (l.bu || 0));
const outstanding = l => Math.max(0, (Number(l.balance) || 0)
  + sum(S.charges.filter(c => c.loanId === l.id && afterBase(l, c)), c => c.amount)
  - sum(S.payments.filter(p => p.loanId === l.id && afterBase(l, p)), p => p.amount));

/* Months needed to clear balance B paying P a month (interest is compounded monthly when a rate is given). */
function nper(B, P, rate){
  if(!(B > 0)) return 0;
  if(!(P > 0)) return Infinity;
  const r = (Number(rate) || 0) / 1200;
  if(r > 0){ if(P <= B * r) return Infinity; return Math.ceil(-Math.log(1 - r * B / P) / Math.log(1 + r)); }
  return Math.ceil(B / P);
}
/* Loan maths. Four interest methods, so it can match what a lender actually does:
   reducing = rate a year on the falling balance (standard amortising loan)
   flat     = rate a year on the ORIGINAL amount for the whole tenure (common with Nigerian consumer loans)
   total    = the exact total interest the lender quoted
   none     = interest-free */
const ITYPES = {
  reducing:'Reducing balance (rate % a year on what is still owed)',
  flat:'Flat rate (rate % a year on the original amount)',
  total:'Exact total interest (amount quoted by the lender)',
  none:'No interest'
};
const rM = rate => (Number(rate) || 0) / 1200;
const annRate = (rate, per) => (Number(rate) || 0) * (per === 'month' ? 12 : 1);   // a monthly rate x 12 = the nominal yearly rate
function pmt(P, rate, n){
  if(!(P > 0) || !(n > 0)) return 0;
  const r = rM(rate); return r > 0 ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
}
function schedBal(P, rate, n, k, M){            // reducing balance: principal left after k payments of M
  if(k <= 0) return P;
  const r = rM(rate);
  return Math.max(0, r > 0 ? P * Math.pow(1 + r, k) - M * (Math.pow(1 + r, k) - 1) / r : P - M * k);
}
function calcTerms(P, itype, rate, iamount, n){
  if(!(P > 0) || !(n > 0)) return null;
  itype = ITYPES[itype] ? itype : 'reducing';
  let I;
  if(itype === 'flat') I = P * (Number(rate) || 0) / 100 * (n / 12);
  else if(itype === 'total') I = Math.max(0, Number(iamount) || 0);
  else if(itype === 'none') I = 0;
  else I = Math.max(0, pmt(P, rate, n) * n - P);
  return {I, total:P + I, M: itype === 'reducing' ? pmt(P, rate, n) : (P + I) / n};
}
function monthsBetween(a, b){
  if(!a || !b) return 0;
  const [ya, ma, da] = a.split('-').map(Number), [yb, mb, db] = b.split('-').map(Number);
  return Math.max(0, (yb - ya) * 12 + (mb - ma) - (db < da ? 1 : 0));
}
function loanInfo(l){
  const n = Math.round(Number(l.tenure)) || 0, o = outstanding(l), type = ITYPES[l.itype] ? l.itype : 'reducing';
  const ra = annRate(l.rate, l.rper);
  const T = calcTerms(l.original, type, ra, l.iamount, n);
  const M = Number(l.monthly) || (T ? T.M : 0);
  const eff = type === 'reducing' ? ra : 0;   // interest is already inside the balance for the other methods
  const logged = S.payments.filter(p => p.loanId === l.id && p.kind !== 'lump' && afterBase(l, p)).length;
  const made = (Number(l.made) || 0) + logged;
  const totalInterest = !T ? null : type === 'reducing' ? Math.max(0, M * n - l.original) : T.I;
  const Ms = T && Math.abs(M - T.M) < 0.01 ? T.M : M;
  const sched = n === 0 ? null : type === 'reducing' ? schedBal(l.original, ra, n, made, Ms) : Math.max(0, l.original + totalInterest - made * Ms);
  const charged = sum(S.charges.filter(c => c.loanId === l.id), c => c.amount);
  const lumps = sum(S.payments.filter(p => p.loanId === l.id && p.kind === 'lump' && afterBase(l, p)), p => p.amount);
  const paidTotal = made * M + lumps, principalPaid = Math.max(0, l.original - o), interestPaid = Math.max(0, paidTotal - principalPaid);
  const rateHint = type === 'reducing' && l.rper !== 'month' && n > 0 && Number(l.rate) > 0 && M > 0 && Math.abs(pmt(l.original, Number(l.rate) * 12, n) - M) <= M * 0.005 && Math.abs(pmt(l.original, Number(l.rate), n) - M) > M * 0.02;
  return {rateHint, n, o, M, type, eff, made, paidTotal, principalPaid, interestPaid, ra, left: n > 0 ? Math.max(0, n - made) : null, sched, totalInterest,
    totalRepay: totalInterest === null ? null : l.original + totalInterest, charged,
    dueNow: n > 0 && l.start ? Math.min(n, monthsBetween(l.start, todayStr())) : null,
    endMonth: n > 0 && l.start ? shiftMonth(l.start.slice(0, 7), n) : null,
    months: nper(o, M, eff)};
}
function loanPreviewText(P, itype, rate, iamount, n, monthly){
  const T = calcTerms(P, itype, rate, iamount, n);
  if(!T) return 'Enter the loan amount and tenure to see the calculated repayment, total interest and total to repay.';
  const M = monthly > 0 ? monthly : T.M, rd = (itype || 'reducing') === 'reducing';
  const ti = rd ? Math.max(0, M * n - P) : T.I;
  return 'Monthly repayment: ' + money(M) + (monthly > 0 && Math.abs(monthly - T.M) > 1 ? ' (you entered this; the method calculates ' + money(T.M) + ')' : ' (calculated)') +
    ' · total interest: ' + money(ti) + ' · total to repay: ' + money(P + ti) + '.';
}
function payoffText(n, rate){
  if(n === 0) return 'paid off';
  if(n === Infinity) return Number(rate) > 0 ? 'the repayment does not cover the interest' : 'set a monthly repayment to see this';
  return n + ' month' + (n === 1 ? '' : 's') + ' (about ' + monthName(shiftMonth(curMonth, n)) + ')';
}
function whatIfText(l, x){
  const I = loanInfo(l), o = I.o, M = I.M, n = I.months, o2 = Math.max(0, o - x), n2 = nper(o2, M, I.eff);
  if(o2 === 0) return 'A lump sum of ' + money(x) + ' would clear the loan completely.';
  let t = 'A lump sum of ' + money(x) + ' would leave ' + money(o2) + ' outstanding. ';
  if(!isFinite(n2)) return t + 'At the current monthly repayment it would still not clear.';
  if(!isFinite(n)) return t + 'Payoff would be ' + payoffText(n2, I.eff) + '.';
  const saved = n - n2;
  t += 'Keep paying ' + money(M) + ' and the loan ends in ' + monthName(shiftMonth(curMonth, n2)) + (saved > 0 ? ' (about ' + saved + ' month' + (saved === 1 ? '' : 's') + ' sooner)' : '') + '.';
  if(I.type === 'reducing' && Number(l.rate) > 0){ const i1 = n * M - o, i2 = n2 * M - o2; if(i1 - i2 > 0) t += ' That saves roughly ' + money(i1 - i2) + ' interest.'; }
  if(I.left > 0){ const M2 = pmt(o2, I.eff, I.left); if(M2 > 0 && M2 < M - 1) t += ' Or keep the same end date (' + I.left + ' repayments left) and lower the monthly repayment to about ' + money(M2) + '.'; }
  if(I.type !== 'reducing') t += ' Whether your lender cuts the interest after a lump sum depends on your loan terms, so check with them.';
  return t;
}
/* ---------- Investments: treasury bills, stocks, landed property, other ---------- */
const IVTYPES = {tbill:'Treasury bill', stock:'Stock', property:'Landed property', other:'Other investment'};
const dparse = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const dfmt = ms => { const d = new Date(ms); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const addDays = (s, n) => dfmt(dparse(s) + n * 86400000);
const diffDays = (a, b) => Math.round((dparse(b) - dparse(a)) / 86400000);
const invTx = i => S.invtx.filter(t => t.invId === i.id).sort((a, b) => a.date.localeCompare(b.date) || (a.u || 0) - (b.u || 0));
const lastOf = (list, kind) => { const l = list.filter(t => t.kind === kind); return l.length ? l[l.length - 1] : null; };
const N = v => Number(v) || 0;

/* Treasury bill: bought at a discount, paid at face value on maturity.
   discount rate: price = face x (1 - rate x days/365).   true yield: face = price x (1 + yield x days/365). */
function tbillInfo(i){
  const cost = N(i.cost), t = Math.round(N(i.tenor)), rate = N(i.rate), rt = i.rtype === 'yield' ? 'yield' : 'discount';
  let face = N(i.face);
  if(!(face > 0) && rate > 0 && t > 0 && cost > 0) face = rt === 'discount' ? cost / Math.max(0.0001, 1 - rate / 100 * t / 365) : cost * (1 + rate / 100 * t / 365);
  if(!(face > 0)) face = cost;
  const interest = Math.max(0, face - cost), today = todayStr();
  const mat = t > 0 && i.date ? addDays(i.date, t) : '';
  const elapsed = mat ? Math.min(t, Math.max(0, diffDays(i.date, today))) : 0, matured = !!mat && today >= mat;
  const accrued = t > 0 ? cost + interest * elapsed / t : cost;
  return {cost, face, interest, t, mat, elapsed, matured, accrued,
    daysLeft: mat ? Math.max(0, diffDays(today, mat)) : 0,
    periodPct: cost > 0 ? interest / cost * 100 : 0,
    yieldPa: t > 0 && cost > 0 ? (face / cost - 1) * 365 / t * 100 : 0,
    discPa: t > 0 && face > 0 ? (1 - cost / face) * 365 / t * 100 : 0,
    value: i.closed ? 0 : matured ? face : accrued};
}
/* Stock: average-cost method. Selling uses the average cost of what you hold at that moment. */
function stockInfo(i){
  const tx = invTx(i); let units = 0, held = 0, realised = 0, divs = 0, bought = 0, fees = 0, price = 0, pdate = '';
  tx.forEach(t => {
    if(t.kind === 'buy'){ const c = N(t.units) * N(t.price) + N(t.fee); units += N(t.units); held += c; bought += c; fees += N(t.fee); price = N(t.price); pdate = t.date; }
    else if(t.kind === 'sell'){ const u = Math.min(units, N(t.units)), avg = units > 0 ? held / units : 0; realised += u * N(t.price) - N(t.fee) - avg * u; held -= avg * u; units -= u; fees += N(t.fee); price = N(t.price); pdate = t.date; }
    else if(t.kind === 'dividend') divs += N(t.amount);
    else if(t.kind === 'price'){ price = N(t.price); pdate = t.date; }
  });
  if(units < 1e-9){ units = 0; held = 0; }
  const value = units * price, unreal = value - held, totalReturn = unreal + realised + divs;
  return {units, price, avg: units > 0 ? held / units : 0, cost: held, value, unreal, unrealPct: held > 0 ? unreal / held * 100 : 0,
    realised, divs, bought, fees, totalReturn, totalPct: bought > 0 ? totalReturn / bought * 100 : 0, open: units > 0,
    priceDate: pdate};
}
/* Landed property: price plus buying costs, paid in instalments, valued by you from time to time. */
function propInfo(i){
  const tx = invTx(i), price = N(i.price), fees = N(i.fees), total = price + fees;
  const paid = sum(tx.filter(t => t.kind === 'pay'), t => t.amount), income = sum(tx.filter(t => t.kind === 'income'), t => t.amount), costs = sum(tx.filter(t => t.kind === 'cost'), t => t.amount);
  const vt = lastOf(tx, 'value'), value = vt ? N(vt.amount) : (N(i.valueNow) || total);
  const years = i.date ? Math.max(0, diffDays(i.date, todayStr()) / 365.25) : 0, gain = value - total;
  return {price, fees, total, paid, balance: Math.max(0, total - paid), income, costs, net: income - costs, value, gain, gainPct: total > 0 ? gain / total * 100 : 0, years,
    cagr: years >= 0.5 && total > 0 && value > 0 ? (Math.pow(value / total, 1 / years) - 1) * 100 : null,
    grossYield: years >= 0.5 && value > 0 ? income / years / value * 100 : null,
    netYield: years >= 0.5 && value > 0 ? (income - costs) / years / value * 100 : null,
    valueDate: vt ? vt.date : ''};
}
/* Other (fixed deposit, mutual fund, bond, cooperative...): money you put in, what it is worth now, income it pays. */
function otherInfo(i){
  const tx = invTx(i), cost = sum(tx.filter(t => t.kind === 'pay'), t => t.amount), income = sum(tx.filter(t => t.kind === 'income'), t => t.amount), costs = sum(tx.filter(t => t.kind === 'cost'), t => t.amount);
  const vt = lastOf(tx, 'value'), value = vt ? N(vt.amount) : cost, gain = value - cost;
  const years = i.date ? Math.max(0, diffDays(i.date, todayStr()) / 365.25) : 0;
  return {cost, income, costs, value, gain, gainPct: cost > 0 ? gain / cost * 100 : 0, years,
    cagr: years >= 0.5 && cost > 0 && value > 0 ? (Math.pow(value / cost, 1 / years) - 1) * 100 : null, valueDate: vt ? vt.date : ''};
}
function invSummary(i){                       // what counts in the portfolio totals
  if(i.type === 'tbill'){ const T = tbillInfo(i); return {cost: i.closed ? 0 : T.cost, value: T.value, open: !i.closed}; }
  if(i.type === 'stock'){ const T = stockInfo(i); return {cost: T.cost, value: T.value, open: T.open}; }
  if(i.type === 'property'){ const T = propInfo(i); return {cost: T.total, value: T.value, open: true}; }
  const T = otherInfo(i); return {cost: T.cost, value: T.value, open: true};
}
function returnsReceived(i){                  // interest, dividends, rent and profits already banked
  if(i.type === 'tbill'){ const T = tbillInfo(i); return T.matured || i.closed ? T.interest : 0; }
  if(i.type === 'stock'){ const T = stockInfo(i); return T.divs + T.realised; }
  if(i.type === 'property') return propInfo(i).net;
  return otherInfo(i).income - otherInfo(i).costs;
}
/* Cash that moved in a month: buying and paying is money out, maturities, sales, dividends and rent are money in. */
function invFlows(m){
  if(S.invFlow === false) return {out:0, inn:0};
  const today = todayStr(); let out = 0, inn = 0;
  S.investments.forEach(i => {
    if(i.type === 'tbill'){ const T = tbillInfo(i); if(i.date && i.date <= today && inMonth(i.date, m)) out += T.cost; if(T.mat && T.mat <= today && inMonth(T.mat, m)) inn += T.face; return; }
    invTx(i).forEach(t => {
      if(t.date > today || !inMonth(t.date, m)) return;
      if(t.kind === 'buy' || t.kind === 'pay' || t.kind === 'cost') out += N(t.amount);
      else if(t.kind === 'sell' || t.kind === 'dividend' || t.kind === 'income') inn += N(t.amount);
    });
  });
  return {out, inn};
}
function invPreviewText(d){
  if(d.type === 'tbill'){
    const T = tbillInfo({date:d.date || todayStr(), tenor:amt(d.tenor), cost:amt(d.cost), face:amt(d.face), rate:d.rate, rtype:d.rtype});
    if(!(T.cost > 0) || !(T.t > 0)) return 'Enter the amount invested and the tenor in days to see the maturity value, interest and yield.';
    return 'Matures ' + fmtDate(T.mat) + ' · pays ' + money(T.face) + ' · interest ' + money(T.interest) + ' (' + T.periodPct.toFixed(2) + '% over ' + T.t + ' days) · true yield ' + T.yieldPa.toFixed(2) + '% a year · discount rate ' + T.discPa.toFixed(2) + '% a year.';
  }
  if(d.type === 'stock'){ const un = amt(d.units), pr = amt(d.price), fee = amt(d.fee) || 0; return un > 0 && pr > 0 ? 'Total cost ' + money(un * pr + fee) + ' · break-even price ' + money((un * pr + fee) / un) + ' a unit.' : ''; }
  if(d.type === 'property'){ const pr = amt(d.price), fe = amt(d.fees) || 0, pd = amt(d.paid) || 0; return pr > 0 ? 'Total cost ' + money(pr + fe) + (pd > 0 ? ' · paid ' + money(pd) + ' · ' + money(Math.max(0, pr + fe - pd)) + ' still to pay' : '') + '.' : ''; }
  return '';
}

const isLoanCat = x => /^loan repayment/i.test(String(x.category || '').trim());   // e.g. old or ended loans recorded as expenses
function monthTotals(m){
  const ex   = S.expenses.filter(x => inMonth(x.date, m));
  const inc  = sum(S.income.filter(x => inMonth(x.date, m)), x => x.amount);
  const exp  = sum(ex.filter(x => !isLoanCat(x)), x => x.amount);
  const loan = sum(S.payments.filter(x => inMonth(x.date, m)), x => x.amount) + sum(ex.filter(isLoanCat), x => x.amount);
  const sav  = sum(S.contribs.filter(x => inMonth(x.date, m)), x => x.amount);
  const proj = sum(S.fundTx.filter(x => x.kind === 'in' && inMonth(x.date, m)), x => x.amount);
  const F = invFlows(m);
  return {inc, exp, loan, sav, proj, inv:F.out, invIn:F.inn, left: inc - exp - loan - sav - proj - F.out + F.inn};
}
/* Loans set to "log automatically" get one monthly repayment per month on the chosen day, from the balance date until today.
   Each one has a fixed id (auto-<loan>-<month>) so two devices never create it twice, and a deleted one stays deleted. */
function runAuto(){
  let changed = false; const today = todayStr();
  S.loans.forEach(l => {
    if(!l.auto) return;
    const day = Math.min(28, Math.max(1, Math.round(Number(l.autoDay)) || 1)), dateOf = mm => mm + '-' + pad(day);
    let m = l.asAt ? l.asAt.slice(0, 7) : curMonth;
    if(l.asAt && dateOf(m) <= l.asAt) m = shiftMonth(m, 1);
    for(let i = 0; i < 60 && dateOf(m) <= today; i++, m = shiftMonth(m, 1)){
      const id = 'auto-' + l.id + '-' + m;
      if(S.tomb[id] || S.payments.some(p => p.id === id)) continue;
      if(S.payments.some(p => p.loanId === l.id && p.kind !== 'lump' && inMonth(p.date, m))) continue;   // you logged that month yourself
      const o = outstanding(l); if(!(o > 0)) break;
      const a = Math.round(Math.min(loanInfo(l).M, o) * 100) / 100; if(!(a > 0)) break;
      S.payments.push({id, u:Date.now(), loanId:l.id, date:dateOf(m), amount:a, kind:'monthly', auto:true}); changed = true;
    }
  });
  return changed;
}

        ${list.map(x => `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.earner)}</td><td>${esc(x.source)}</td><td>${esc(x.note)}</td><td class="r">${money(x.amount)}</td>
          <td class="r"><button class="linkbtn" data-act="edit" data-type="income" data-id="${x.id}">Edit</button><button class="linkbtn del" data-act="del" data-type="income" data-id="${x.id}">Delete</button></td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="4">Total income</td><td class="r">${money(sum(list, x => x.amount))}</td><td></td></tr></tfoot></table></div>`
        : `<div class="empty">No income recorded for ${monthName(m)}. Add an entry above${S.income.length ? ' or copy last month\'s.' : '.'}</div>`}

        <label>Description<input name="desc" required placeholder="What was it for?" value="${esc(it ? it.desc : '')}"></label>
        <label>Paid by<select name="payer">${payers.map(p => `<option ${it && it.payer === p ? 'selected' : ''}>${esc(p)}</option>`).join('')}</select></label>

        <div class="actions"><button class="btn primary" type="submit">${it ? 'Save changes' : 'Add expense'}</button>${it ? '<button class="btn" type="button" data-act="cancel-edit">Cancel</button>' : ''}</div>
      </form></section>
      <section class="block"><div class="actions" style="justify-content:space-between;margin-bottom:12px"><h2>Expenses in ${monthName(m)}</h2>
        <div class="actions"><select id="catfilter" aria-label="Filter by category"><option value="">All categories</option>${cats.map(c => `<option ${ui.catFilter === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>

        ${list.length ? `<div class="tw"><table class="data"><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Paid by</th><th class="r">Amount</th><th></th></tr></thead><tbody>
        ${list.map(x => `<tr><td>${fmtDate(x.date)}</td><td>${esc(x.category)}</td><td>${esc(x.desc)}</td><td>${esc(x.payer)}</td><td class="r">${money(x.amount)}</td>
          <td class="r"><button class="linkbtn" data-act="edit" data-type="expense" data-id="${x.id}">Edit</button><button class="linkbtn del" data-act="del" data-type="expense" data-id="${x.id}">Delete</button></td></tr>`).join('')}
        </tbody><tfoot><tr><td colspan="4">${ui.catFilter ? 'Total for ' + esc(ui.catFilter) : 'Total expenses'}</td><td class="r">${money(sum(list, x => x.amount))}</td><td></td></tr></tfoot></table></div>`
        : `<div class="empty">No expenses ${ui.catFilter ? 'in this category ' : ''}for ${monthName(m)}.</div>`}
      </section>`;

  loans(){
    const it = ui.edit && ui.edit.type === 'loan' ? S.loans.find(x => x.id === ui.edit.id) : null;
    const itSel = it && ITYPES[it.itype] ? it.itype : 'reducing';
    const cards = S.loans.map(l => {
      const I = loanInfo(l), o = I.o, n = I.n, paid = Math.max(0, l.original - o);
      const pays = S.payments.filter(p => p.loanId === l.id).sort((a,b) => b.date.localeCompare(a.date));
      const chg = S.charges.filter(c => c.loanId === l.id).sort((a,b) => b.date.localeCompare(a.date));
      const thisMonth = sum(pays.filter(p => inMonth(p.date, curMonth) && p.kind !== 'lump'), p => p.amount);
      const lump = sum(pays.filter(p => p.kind === 'lump'), p => p.amount);
      const interestToGo = I.type === 'reducing' && Number(l.rate) > 0 && isFinite(I.months) && I.months > 0 ? Math.max(0, I.months * I.M - o) : 0;
      const diff = I.sched === null ? 0 : I.sched - o;
      const yrs = n > 0 ? (n / 12).toFixed(1).replace(/\.0$/, '') : '';
      const behind = I.dueNow === null ? null : I.dueNow - I.made;
      const terms = n > 0 ? `<div class="stats">
          <div class="stat"><span>Start date</span><b>${l.start ? fmtDate(l.start) : 'Not set'}</b>${I.endMonth ? `<span>ends ${monthName(I.endMonth)}</span>` : ''}</div>
          <div class="stat"><span>Tenure</span><b>${n} months</b><span>${yrs} year${yrs === '1' ? '' : 's'}</span></div>
          <div class="stat"><span>Repayments made</span><b>${I.made} of ${n}</b>${behind !== null ? `<span>${behind > 0 ? behind + ' behind, ' + I.dueNow + ' due by now' : behind < 0 ? (-behind) + ' ahead of the calendar' : 'on track with the calendar'}</span>` : ''}</div>
          <div class="stat"><span>Repayments left</span><b>${I.left}</b></div>
        </div>
        <div class="stats">
          <div class="stat"><span>Interest method</span><b>${{reducing:'Reducing balance', flat:'Flat rate', total:'Fixed total', none:'None'}[I.type]}</b>${I.type === 'reducing' || I.type === 'flat' ? `<span>${Number(l.rate) || 0}% a ${l.rper === 'month' ? 'month' : 'year'}</span>` : ''}</div>
          <div class="stat"><span>Total interest over the loan</span><b>${money(I.totalInterest)}</b></div>
          <div class="stat"><span>Total to repay</span><b>${money(I.totalRepay)}</b></div>
          <div class="stat"><span>Extra interest you recorded</span><b>${money(I.charged)}</b><span>${chg.length ? chg.length + ' entr' + (chg.length === 1 ? 'y' : 'ies') : 'none added'}</span></div>
        </div>
        <div class="stats">
          <div class="stat"><span>Expected balance on schedule</span><b>${money(I.sched)}</b></div>
          <div class="stat"><span>Against schedule</span><b>${Math.abs(diff) < 1 ? 'On schedule' : money(Math.abs(diff)) + (diff > 0 ? ' ahead' : ' behind')}</b></div>
        </div>` : `<p class="hint">Add the tenure, start date and interest details with <strong>Edit loan</strong> to see repayments left, total interest and whether you are ahead of schedule.</p>`;
      const op = k => ui.openKeys.has(k) ? 'open' : '';
      const paidSplit = (I.n > 0 || I.made > 0) ? `<h3 style="font-size:15px;margin:16px 0 8px">What you have paid</h3><div class="stats">
          <div class="stat"><span>Paid to the lender so far</span><b>${money(I.paidTotal)}</b><span>${I.made} repayment${I.made === 1 ? '' : 's'} x ${money(I.M)}${I.paidTotal > I.made * I.M ? ' plus lump sums' : ''}</span></div>
          <div class="stat"><span>Of that, principal</span><b>${money(Math.min(I.principalPaid, I.paidTotal))}</b></div>
          <div class="stat"><span>Of that, interest</span><b>${money(I.interestPaid)}</b></div>
        </div>
        <p class="hint" style="margin:-4px 0 4px">Each repayment covers that month's interest first, and only the rest reduces what you owe.</p>` : '';
      return `<section class="block"><div class="line"><h2>${esc(l.name)}</h2><span class="hint">${l.asAt ? 'Balance confirmed ' + fmtDate(l.asAt) : ''}</span></div>
        <div class="stats">
          <div class="stat"><span>Amount taken</span><b>${money(l.original)}</b></div>
          <div class="stat"><span>Repayments made</span><b>${I.made}${n > 0 ? ' of ' + n : ''}</b></div>
          <div class="stat"><span>Outstanding</span><b>${money(o)}</b></div>
        </div>
        <div class="bar debt"><i style="width:${Math.min(100,pct(paid,l.original))}%"></i></div>
        <p class="hint" style="margin:8px 0 10px">${pct(paid,l.original)}% of the loan repaid</p>
        ${I.rateHint ? `<p class="note">Your repayment of ${money(I.M)} matches a rate of ${esc(l.rate)}% a <strong>month</strong>, but this loan is set to ${esc(l.rate)}% a year, so the schedule figures will be wrong. <button class="btn small" data-act="fix-rate" data-id="${l.id}">Switch to per month</button></p>` : ''}
        <details class="box" data-key="log-${l.id}" ${op('log-' + l.id)}><summary>Log a repayment</summary>
          <form class="entry" data-form="payment" style="margin-top:10px"><input type="hidden" name="loanId" value="${l.id}">
            <label>Date<input type="date" name="date" required value="${todayStr()}"></label>
            <label>Type<select name="kind"><option value="monthly">Monthly repayment</option><option value="lump">Lump sum</option></select></label>
            <label>Amount (${esc(S.currency)})<input type="number" name="amount" required min="0.01" step="0.01" inputmode="decimal" value="${I.M ? Math.round(I.M * 100) / 100 : ''}"></label>
            <div class="actions"><button class="btn primary" type="submit">Log payment</button></div></form>
          <p class="hint" style="margin:0">Each monthly repayment adds one to "Repayments made". Lump sums lower the balance but are not a scheduled repayment.</p></details>
        <details class="box" data-key="more-${l.id}" ${op('more-' + l.id)}><summary>View details</summary>
          <div class="stats" style="margin-top:10px">
            <div class="stat"><span>Monthly repayment</span><b>${money(I.M)}</b></div>
            <div class="stat"><span>Paid this month</span><b>${money(thisMonth)}</b><span>of ${money(I.M)}</span></div>
            <div class="stat"><span>Repayments left</span><b>${I.left === null ? 'Set a tenure' : I.left}</b></div>
          </div>
          ${paidSplit}
          <h3 style="font-size:15px;margin:16px 0 8px">Loan terms</h3>
          ${terms}
          <p class="hint">At ${money(I.M)} a month the loan clears in ${payoffText(I.months, I.eff)}${interestToGo ? ` · about ${money(interestToGo)} interest still to pay` : ''}${lump ? ` · ${money(lump)} in lump sums logged` : ''}.</p>
          <h3 style="font-size:15px;margin:16px 0 8px">Add extra interest charged</h3>
          <form class="entry" data-form="charge"><input type="hidden" name="loanId" value="${l.id}">
            <label>Date charged<input type="date" name="date" required value="${todayStr()}"></label>
            <label>Interest amount (${esc(S.currency)})<input type="number" name="amount" required min="0.01" step="0.01" inputmode="decimal"></label>
            <label>Note<input name="note" placeholder="e.g. September statement"></label>
            <div class="actions"><button class="btn" type="submit">Add interest</button></div></form>
          <p class="hint" style="margin:0">Only for extra interest your lender adds on top of your normal repayments, exactly as their statement shows it. It is added to the outstanding balance. The interest already inside your monthly repayment is worked out for you.</p>
          <h3 style="font-size:15px;margin:16px 0 8px">What if I pay a lump sum?</h3>
          <div class="entry"><label>Lump sum amount (${esc(S.currency)})<input type="number" min="0" step="0.01" inputmode="decimal" data-whatif="${l.id}" placeholder="e.g. 500000"></label></div>
          <div class="hint" id="whatif-${l.id}">Type an amount to see how much sooner the loan would clear.</div>
          <h3 style="font-size:15px;margin:16px 0 8px">Update from your lender's statement</h3>
          <form class="entry" data-form="updbal"><input type="hidden" name="loanId" value="${l.id}">
            <label>Outstanding balance (${esc(S.currency)})<input type="number" name="balance" required min="0" step="0.01" inputmode="decimal" value="${Math.round(o * 100) / 100}"></label>
            <label>Repayments made so far<input type="number" name="made" min="0" step="1" inputmode="numeric" value="${I.made}"></label>
            <label>As at<input type="date" name="asAt" required value="${todayStr()}"></label>
            <div class="actions"><button class="btn" type="submit">Update</button></div></form>
          <p class="hint" style="margin:0">Payments and interest dated after this day carry on from here.</p>
          ${pays.length ? `<h3 style="font-size:15px;margin:16px 0 4px">${pays.length} repayment${pays.length>1?'s':''} logged</h3><div class="tw"><table class="data"><tbody>
            ${pays.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${p.kind === 'lump' ? 'Lump sum' : 'Monthly'}</td><td class="r">${money(p.amount)}</td><td class="r"><button class="linkbtn del" data-act="del-child" data-coll="payments" data-id="${p.id}">Delete</button></td></tr>`).join('')}
          </tbody></table></div>` : ''}
          ${chg.length ? `<h3 style="font-size:15px;margin:16px 0 4px">${chg.length} extra interest entr${chg.length>1?'ies':'y'}</h3><div class="tw"><table class="data"><tbody>
            ${chg.map(c => `<tr><td>${fmtDate(c.date)}</td><td>${esc(c.note || 'Interest')}</td><td class="r">${money(c.amount)}</td><td class="r"><button class="linkbtn del" data-act="del-child" data-coll="charges" data-id="${c.id}">Delete</button></td></tr>`).join('')}
          </tbody></table></div>` : ''}
        </details>
        <div class="actions" style="margin-top:12px"><button class="btn small" data-act="edit" data-type="loan" data-id="${l.id}">Edit loan</button><button class="btn small danger" data-act="del" data-type="loan" data-id="${l.id}">Delete loan</button></div>
      </section>`;
    }).join('');
    const total = sum(S.loans, l => outstanding(l)), totalMonthly = sum(S.loans, l => loanInfo(l).M);
    return `<section class="block"><h2>${it ? 'Edit loan' : 'Add a loan'}</h2>
      <form class="entry" data-form="loan"><input type="hidden" name="id" value="${it ? it.id : ''}">
        <label>Loan name<input name="name" required placeholder="Car loan, mortgage…" value="${esc(it ? it.name : '')}"></label>
        <label>Original loan amount (${esc(S.currency)})<input type="number" name="original" required min="0.01" step="0.01" inputmode="decimal" value="${it ? it.original : ''}"></label>
        <label>Loan start date<input type="date" name="start" value="${it && it.start ? it.start : ''}"></label>
        <label>Tenure (months)<input type="number" name="tenure" min="0" step="1" inputmode="numeric" placeholder="e.g. 36" value="${it && it.tenure ? it.tenure : ''}"></label>
        <label>How is interest charged?<select name="itype">${Object.entries(ITYPES).map(([k, v]) => `<option value="${k}" ${itSel === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></label>
        <label>Interest rate % (reducing or flat)<input type="number" name="rate" min="0" step="0.01" inputmode="decimal" placeholder="e.g. 2.95" value="${it ? esc(it.rate) : ''}"></label>
        <label>Rate is charged per<select name="rper"><option value="year" ${it && it.rper === 'month' ? '' : 'selected'}>Year</option><option value="month" ${it && it.rper === 'month' ? 'selected' : ''}>Month</option></select></label>
        <label>Exact total interest (only for "exact total")<input type="number" name="iamount" min="0" step="0.01" inputmode="decimal" value="${it && it.iamount ? it.iamount : ''}"></label>
        <label>Monthly repayment (${esc(S.currency)})<input type="number" name="monthly" min="0" step="0.01" inputmode="decimal" placeholder="Blank = calculate" value="${it ? it.monthly : ''}"></label>
        <label>Repayments made so far<input type="number" name="made" min="0" step="1" inputmode="numeric" placeholder="Blank = from start date" value="${it && it.made ? it.made : ''}"></label>
        <label>Outstanding balance (${esc(S.currency)})<input type="number" name="balance" min="0" step="0.01" inputmode="decimal" placeholder="Blank = calculate" value="${it ? it.balance : ''}"></label>
        <label>Balance and repayments as at<input type="date" name="asAt" required value="${it ? (it.asAt || todayStr()) : todayStr()}"></label>
        <label>Log the monthly repayment automatically?<select name="auto"><option value="no" ${it && it.auto ? '' : 'selected'}>No, I will log it myself</option><option value="yes" ${it && it.auto ? 'selected' : ''}>Yes, once a month</option></select></label>
        <label>Automatic repayment day of the month<input type="number" name="autoDay" min="1" max="28" step="1" inputmode="numeric" placeholder="e.g. 5" value="${it && it.autoDay ? it.autoDay : ''}"></label>
        <div class="actions"><button class="btn primary" type="submit">${it ? 'Save changes' : 'Add loan'}</button>${it ? '<button class="btn" type="button" data-act="cancel-edit">Cancel</button>' : ''}</div>
      </form>
      <p class="note" id="loanpreview" style="margin-top:12px">${loanPreviewText(it ? it.original : 0, itSel, it ? annRate(it.rate, it.rper) : 0, it ? it.iamount : 0, it ? it.tenure : 0, it ? it.monthly : 0)}</p>
      <p class="hint"><strong>Rate per year or per month:</strong> a rate like 2.95% is usually a monthly rate, so choose Month if your lender quotes it that way. <strong>Reducing balance:</strong> interest is charged on what you still owe, so it shrinks each month. <strong>Flat rate:</strong> interest is worked out once on the original amount, for example ${money(1000000)} at 10% flat for 12 months is ${money(100000)} interest and ${money(1100000)} to repay. <strong>Exact total interest:</strong> type the interest figure from your loan agreement. Anything you type in the monthly repayment or balance boxes is used exactly as entered. If you leave them blank they are calculated. <strong>Automatic logging</strong> adds your monthly repayment on the chosen day each month, from the balance date until today, so you do not have to log it by hand. Delete any single one if that month was different.</p>
      ${S.loans.length ? `<p style="margin:12px 0 0"><strong>Total outstanding: ${money(total)}</strong> · ${money(totalMonthly)} a month across ${S.loans.length} loan${S.loans.length>1?'s':''}</p>` : ''}</section>
      ${cards || '<div class="empty">No loans yet. Add one above.</div>'}`;
  },

  investments(){
    const it = ui.edit && ui.edit.type === 'investment' ? S.investments.find(x => x.id === ui.edit.id) : null;
    const type = it ? it.type : ui.invType, today = todayStr();
    const all = S.investments.map(i => ({i, s:invSummary(i)})), open = all.filter(x => x.s.open), closed = all.filter(x => !x.s.open);
    const cost = sum(open, x => x.s.cost), value = sum(open, x => x.s.value), gain = value - cost;
    const owed = sum(S.investments.filter(i => i.type === 'property'), i => propInfo(i).balance);
    const received = sum(S.investments, i => returnsReceived(i));
    const sg = (g, p) => (g > 0 ? '+' : '') + money(g) + (p === null ? '' : '  (' + (g >= 0 ? '+' : '−') + Math.abs(p).toFixed(1) + '%)');
    const tile = (label, val, sub) => `<div class="stat"><span>${label}</span><b>${val}</b>${sub ? `<span>${sub}</span>` : ''}</div>`;
    const op = k => ui.openKeys.has(k) ? 'open' : '';
    const F = (name, label, attrs, val) => `<label>${label}<input name="${name}" ${attrs} value="${esc(val ?? '')}"></label>`;
    const num = 'type="number" min="0" step="any" inputmode="decimal"';
    const v = f => it ? it[f] : '';

    /* ---- add / edit form ---- */
    let fields = '';
    if(type === 'tbill') fields = F('name','Name','required placeholder="e.g. 364-day T-bill"', v('name')) + F('date','Purchase date','type="date" required', it ? it.date : today) +
      F('tenor','Tenor (days)', 'type="number" min="1" step="1" required inputmode="numeric" placeholder="91, 182 or 364"', v('tenor')) + F('cost','Amount invested ('+esc(S.currency)+')','required '+num, v('cost')) +
      F('face','Value at maturity (optional)', num + ' placeholder="Blank = calculate from the rate"', it && it.face ? it.face : '') + F('rate','Rate % a year (optional)', num + ' placeholder="e.g. 18.5"', v('rate')) +
      `<label>The rate is a<select name="rtype"><option value="discount" ${it && it.rtype === 'yield' ? '' : 'selected'}>Discount rate (as at the CBN auction)</option><option value="yield" ${it && it.rtype === 'yield' ? 'selected' : ''}>True yield (what you earn)</option></select></label>`;
    else if(type === 'stock') fields = F('name','Company','required placeholder="e.g. Zenith Bank"', v('name')) + F('ticker','Ticker (optional)','placeholder="ZENITHBANK"', v('ticker')) +
      (it ? '' : F('date','Purchase date','type="date" required', today) + F('units','Number of shares','required '+num, '') + F('price','Buy price per share ('+esc(S.currency)+')','required '+num, '') + F('fee','Fees and charges (optional)', num, ''));
    else if(type === 'property') fields = F('name','Property','required placeholder="e.g. 2 plots at Epe"', v('name')) + F('location','Location (optional)','', v('location')) + F('size','Size (optional)','placeholder="e.g. 600 sqm"', v('size')) +
      F('date','Purchase date','type="date" required', it ? it.date : today) + F('price','Agreed price ('+esc(S.currency)+')','required '+num, v('price')) + F('fees','Legal, survey and other buying costs', num, it && it.fees ? it.fees : '') +
      (it ? '' : F('paid','Paid so far', num, '') + F('valueNow','Worth today (optional)', num + ' placeholder="Blank = the price"', ''));
    else fields = F('name','Name','required placeholder="e.g. Fixed deposit, mutual fund, bond"', v('name')) + F('date','Start date','type="date" required', it ? it.date : today) +
      (it ? '' : F('cost','Amount invested ('+esc(S.currency)+')','required '+num, '') + F('valueNow','Worth today (optional)', num + ' placeholder="Blank = the amount invested"', ''));
    const typeBtns = Object.entries(IVTYPES).map(([k, lbl]) => `<button type="button" class="btn small ${type === k ? 'primary' : ''}" data-act="inv-type" data-type="${k}" ${it ? 'disabled' : ''}>${lbl}</button>`).join(' ');
    const addForm = `<details class="box" data-key="invadd" ${(it || !S.investments.length || ui.openKeys.has('invadd')) ? 'open' : ''}><summary>${it ? 'Edit investment' : 'Add an investment'}</summary>
      <div class="actions" style="margin:12px 0">${typeBtns}</div>
      <form class="entry" data-form="inv"><input type="hidden" name="id" value="${it ? it.id : ''}"><input type="hidden" name="type" value="${type}">
        ${fields}
        <div class="actions"><button class="btn primary" type="submit">${it ? 'Save changes' : 'Add ' + IVTYPES[type].toLowerCase()}</button>${it ? '<button class="btn" type="button" data-act="cancel-edit">Cancel</button>' : ''}</div>
      </form>
      <p class="note" id="invpreview" style="margin-top:12px">${it && type === 'tbill' ? invPreviewText({type, date:it.date, tenor:it.tenor, cost:it.cost, face:it.face, rate:it.rate, rtype:it.rtype}) : ''}</p>
      ${type === 'tbill' ? '<p class="hint">Enter the value at maturity if you know it, or the rate and it is worked out. A discount rate is how T-bills are quoted at the auction: you pay the face value less the discount. The true yield is what you actually earn on the money you put in.</p>' : ''}
      ${type === 'stock' ? '<p class="hint">Add the first purchase here. Later purchases, sales, dividends and price updates go inside the holding.</p>' : ''}
      ${type === 'property' ? '<p class="hint">Record what you have paid so far. Instalments, rent, running costs and new valuations are added inside the property later.</p>' : ''}
    </details>`;

    /* ---- transaction history table ---- */
    const txLabel = t => ({buy:'Bought ' + N(t.units) + ' at ' + money(t.price), sell:'Sold ' + N(t.units) + ' at ' + money(t.price), dividend:'Dividend', price:'Price updated to ' + money(t.price), pay:'Payment', income:'Income received', cost:'Running cost', value:'Valued at'}[t.kind] || t.kind);
    const txTable = i => { const tx = invTx(i).slice().reverse(); return tx.length ? `<h3 style="font-size:15px;margin:16px 0 4px">History</h3><div class="tw"><table class="data"><tbody>${tx.map(t => `<tr><td>${fmtDate(t.date)}</td><td>${txLabel(t)}${t.note ? ' · ' + esc(t.note) : ''}</td><td class="r">${t.kind === 'price' ? '' : money(t.amount)}</td><td class="r"><button class="linkbtn del" data-act="del-child" data-coll="invtx" data-id="${t.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>` : ''; };
    const editRow = i => `<div class="actions" style="margin-top:12px"><button class="btn small" data-act="edit" data-type="investment" data-id="${i.id}">Edit</button><button class="btn small danger" data-act="del" data-type="investment" data-id="${i.id}">Delete</button></div>`;
    const simpleForm = (i, opts) => `<form class="entry" data-form="invtx" style="margin-top:10px"><input type="hidden" name="invId" value="${i.id}">
        <label>Date<input type="date" name="date" required value="${today}"></label>
        <label>What<select name="kind">${opts}</select></label>
        <label>Amount (${esc(S.currency)})<input type="number" name="amount" required min="0" step="any" inputmode="decimal"></label>
        <label>Note (optional)<input name="note"></label>
        <div class="actions"><button class="btn primary" type="submit">Save</button></div></form>`;

    /* ---- cards ---- */
    const tbillCard = i => {
      const T = tbillInfo(i), pctDone = T.t > 0 ? Math.min(100, T.elapsed / T.t * 100) : 0;
      return `<section class="block"><div class="line"><h2>${esc(i.name)}</h2><span class="hint">Bought ${fmtDate(i.date)} · ${IVTYPES.tbill}</span></div>
        <div class="stats">${tile('Amount invested', money(T.cost))}${tile('Pays at maturity', money(T.face), '+' + money(T.interest) + ' interest')}${tile(T.matured ? 'Matured' : 'Matures', T.mat ? fmtDate(T.mat) : 'Set a tenor', T.matured ? 'ready to collect' : T.daysLeft + ' day' + (T.daysLeft === 1 ? '' : 's') + ' left')}</div>
        <div class="bar fund"><i style="width:${pctDone}%"></i></div><p class="hint" style="margin:8px 0 10px">${Math.round(pctDone)}% of the way to maturity · worth about ${money(T.value)} today</p>
        ${T.matured ? `<p class="note">This bill has matured. ${money(T.face)} is due to you. <button class="btn small" data-act="inv-close" data-id="${i.id}">Mark as collected</button></p>` : ''}
        <details class="box" data-key="more-${i.id}" ${op('more-' + i.id)}><summary>View details</summary>
          <div class="stats" style="margin-top:10px">${tile('Interest at maturity', money(T.interest), T.periodPct.toFixed(2) + '% over ' + T.t + ' days')}${tile('True yield', T.yieldPa.toFixed(2) + '% a year')}${tile('Discount rate', T.discPa.toFixed(2) + '% a year')}${tile('Worth today', money(T.accrued), 'interest earned so far')}</div>
          <p class="hint">Worth today spreads the interest evenly over the days held. ${T.faceFromRate ? 'The maturity value was worked out from the rate you entered.' : ''}</p></details>
        ${editRow(i)}</section>`;
    };
    const stockCard = i => {
      const T = stockInfo(i);
      return `<section class="block"><div class="line"><h2>${esc(i.name)}${i.ticker ? ' <span class="muted" style="font:500 14px var(--body)">' + esc(i.ticker) + '</span>' : ''}</h2><span class="hint">${IVTYPES.stock}</span></div>
        <div class="stats">${tile('Shares held', T.units.toLocaleString('en-US', {maximumFractionDigits:4}), 'at ' + money(T.price) + ' a share')}${tile('Current value', money(T.value))}${tile('Gain / loss', sg(T.unreal, T.unrealPct))}</div>
        <details class="box" data-key="log-${i.id}" ${op('log-' + i.id)}><summary>Buy, sell, dividend or new price</summary>
          <form class="entry" data-form="invtx" style="margin-top:10px"><input type="hidden" name="invId" value="${i.id}">
            <label>Date<input type="date" name="date" required value="${today}"></label>
            <label>What<select name="kind"><option value="price">Update the price</option><option value="buy">Bought more</option><option value="sell">Sold some</option><option value="dividend">Dividend received</option></select></label>
            <label>Price per share<input type="number" name="price" min="0" step="any" inputmode="decimal"></label>
            <label>Number of shares<input type="number" name="units" min="0" step="any" inputmode="decimal"></label>
            <label>Fees (optional)<input type="number" name="fee" min="0" step="any" inputmode="decimal"></label>
            <label>Dividend amount<input type="number" name="amount" min="0" step="any" inputmode="decimal"></label>
            <div class="actions"><button class="btn primary" type="submit">Save</button></div></form>
          <p class="hint" style="margin:0">Price update: fill the price only. Buy or sell: price, shares and fees. Dividend: the amount only.</p></details>
        <details class="box" data-key="more-${i.id}" ${op('more-' + i.id)}><summary>View details</summary>
          <div class="stats" style="margin-top:10px">${tile('Average cost', money(T.avg), 'per share, incl. fees')}${tile('Cost of holding', money(T.cost))}${tile('Dividends received', money(T.divs))}${tile('Profit already taken', money(T.realised), 'from shares sold')}</div>
          <div class="stats">${tile('Total return', sg(T.totalReturn, T.totalPct), 'gain + profit taken + dividends')}${tile('Total bought', money(T.bought))}${tile('Price last set', T.priceDate ? fmtDate(T.priceDate) : 'Not set')}</div>
          <p class="hint">Prices are entered by you, so update them when you want fresh figures. Cost uses the average-cost method.</p>${txTable(i)}</details>
        ${editRow(i)}</section>`;
    };
    const propCard = i => {
      const T = propInfo(i);
      return `<section class="block"><div class="line"><h2>${esc(i.name)}</h2><span class="hint">${esc([i.location, i.size].filter(Boolean).join(' · ')) || IVTYPES.property}</span></div>
        <div class="stats">${tile('Total cost', money(T.total), T.fees ? money(T.price) + ' + ' + money(T.fees) + ' costs' : '')}${tile('Current value', money(T.value), T.valueDate ? 'valued ' + fmtDate(T.valueDate) : 'at the price paid')}${tile('Gain / loss', sg(T.gain, T.gainPct))}</div>
        ${T.balance > 0 ? `<div class="bar debt"><i style="width:${Math.min(100, pct(T.paid, T.total))}%"></i></div><p class="hint" style="margin:8px 0 10px">Paid ${money(T.paid)} of ${money(T.total)} · <strong>${money(T.balance)} still to pay</strong></p>` : `<p class="hint" style="margin:8px 0 10px">Fully paid.</p>`}
        <details class="box" data-key="log-${i.id}" ${op('log-' + i.id)}><summary>Record a payment, income, cost or new value</summary>
          ${simpleForm(i, '<option value="pay">A payment toward the purchase</option><option value="value">A new valuation (worth today)</option><option value="income">Rent or other income received</option><option value="cost">A running cost</option>')}</details>
        <details class="box" data-key="more-${i.id}" ${op('more-' + i.id)}><summary>View details</summary>
          <div class="stats" style="margin-top:10px">${tile('Agreed price', money(T.price))}${tile('Paid so far', money(T.paid))}${tile('Held for', T.years.toFixed(1) + ' years')}${tile('Growth a year', T.cagr === null ? 'Needs 6 months' : T.cagr.toFixed(1) + '%', 'compound, on total cost')}</div>
          <div class="stats">${tile('Income received', money(T.income))}${tile('Running costs', money(T.costs))}${tile('Net income', money(T.net))}${tile('Yield', T.grossYield === null ? 'Needs 6 months' : T.netYield.toFixed(1) + '% net', T.grossYield === null ? '' : T.grossYield.toFixed(1) + '% before costs')}</div>
          <p class="hint">Value is the figure you enter as a valuation, so update it when you have a new one. Yield is income a year divided by current value.</p>${txTable(i)}</details>
        ${editRow(i)}</section>`;
    };
    const otherCard = i => {
      const T = otherInfo(i);
      return `<section class="block"><div class="line"><h2>${esc(i.name)}</h2><span class="hint">Started ${fmtDate(i.date)} · ${IVTYPES.other}</span></div>
        <div class="stats">${tile('Invested', money(T.cost))}${tile('Current value', money(T.value), T.valueDate ? 'valued ' + fmtDate(T.valueDate) : 'at the amount invested')}${tile('Gain / loss', sg(T.gain, T.gainPct))}</div>
        <details class="box" data-key="log-${i.id}" ${op('log-' + i.id)}><summary>Add money, income, a cost or a new value</summary>
          ${simpleForm(i, '<option value="pay">Money put in</option><option value="value">A new valuation (worth today)</option><option value="income">Interest or income received</option><option value="cost">A cost or charge</option>')}</details>
        <details class="box" data-key="more-${i.id}" ${op('more-' + i.id)}><summary>View details</summary>
          <div class="stats" style="margin-top:10px">${tile('Income received', money(T.income))}${tile('Costs', money(T.costs))}${tile('Held for', T.years.toFixed(1) + ' years')}${tile('Growth a year', T.cagr === null ? 'Needs 6 months' : T.cagr.toFixed(1) + '%')}</div>${txTable(i)}</details>
        ${editRow(i)}</section>`;
    };
    const card = i => ({tbill:tbillCard, stock:stockCard, property:propCard}[i.type] || otherCard)(i);

    /* ---- summary + by type ---- */
    const byType = Object.keys(IVTYPES).map(k => { const r = open.filter(x => x.i.type === k); return {k, n:r.length, c:sum(r, x => x.s.cost), v:sum(r, x => x.s.value)}; }).filter(r => r.n);
    const summary = S.investments.length ? `<section class="block"><h2>Your investments</h2>
        <div class="stats">${tile('Total invested', money(cost))}${tile('Current value', money(value))}${tile('Gain / loss', sg(gain, cost > 0 ? gain / cost * 100 : null))}</div>
        <details class="box" data-key="invsum" ${op('invsum')}><summary>View portfolio breakdown</summary>
          <div class="tw"><table class="data" style="margin-top:10px"><thead><tr><th>Type</th><th class="r">Holdings</th><th class="r">Invested</th><th class="r">Value</th><th class="r">Gain / loss</th></tr></thead><tbody>
            ${byType.map(r => `<tr><td>${IVTYPES[r.k]}</td><td class="r">${r.n}</td><td class="r">${money(r.c)}</td><td class="r">${money(r.v)}</td><td class="r">${sg(r.v - r.c, r.c > 0 ? (r.v - r.c) / r.c * 100 : null)}</td></tr>`).join('')}
          </tbody><tfoot><tr><td>Total</td><td class="r">${open.length}</td><td class="r">${money(cost)}</td><td class="r">${money(value)}</td><td class="r">${sg(gain, cost > 0 ? gain / cost * 100 : null)}</td></tr></tfoot></table></div>
          <div class="stats" style="margin-top:12px">${tile('Returns already received', money(received), 'interest, dividends, profits, rent')}${owed > 0 ? tile('Still to pay on property', money(owed)) : ''}</div>
          <p class="hint">Invested is what the holdings cost you. Value uses your latest prices and valuations, and T-bills grow towards their maturity value.</p></details></section>` : '';
    const groups = Object.keys(IVTYPES).map(k => { const r = open.filter(x => x.i.type === k); return r.length ? `<h3 style="font:600 15px var(--display);margin:22px 0 10px;color:var(--muted)">${IVTYPES[k]}s</h3>` + r.map(x => card(x.i)).join('') : ''; }).join('');
    const closedHtml = closed.length ? `<details class="box" data-key="invclosed" ${op('invclosed')}><summary>${closed.length} closed or sold</summary><div class="tw"><table class="data"><tbody>
        ${closed.map(x => { const i = x.i; const r = i.type === 'stock' ? stockInfo(i).totalReturn : returnsReceived(i); return `<tr><td>${esc(i.name)}</td><td>${IVTYPES[i.type]}</td><td class="r">${money(r)} earned</td><td class="r">${i.type === 'tbill' ? `<button class="linkbtn" data-act="inv-reopen" data-id="${i.id}">Reopen</button>` : ''}<button class="linkbtn del" data-act="del" data-type="investment" data-id="${i.id}">Delete</button></td></tr>`; }).join('')}
      </tbody></table></div></details>` : '';
    return `${summary}<section class="block">${addForm}</section>${groups}${closedHtml}
      ${S.investments.length ? '' : '<div class="empty">Nothing here yet. Add a treasury bill, some shares, a piece of land or another investment above.</div>'}
      <p class="hint" style="margin-top:14px">Money you put into investments, and money that comes back from them, count in your monthly cash flow. You can switch that off in Setup &amp; sync.</p>`;
  },

  funds(){
    const it = ui.edit && ui.edit.type === 'fund' ? S.funds.find(x => x.id === ui.edit.id) : null;
    const cards = S.funds.map(f => {
      const i = fundIn(f), o = fundOut(f), bal = i - o;
      const tx = S.fundTx.filter(t => t.fundId === f.id).sort((a,b) => b.date.localeCompare(a.date));
      return `<section class="block"><div class="line"><h2>${esc(f.name)}</h2><span class="hint">${esc(f.note || '')}</span></div>
        <div class="stats">
          <div class="stat"><span>Planned budget</span><b>${f.budget > 0 ? money(f.budget) : 'Not set'}</b></div>
          <div class="stat"><span>Set aside</span><b>${money(i)}</b></div>
          <div class="stat"><span>Spent</span><b>${money(o)}</b></div>
          <div class="stat"><span>In the fund now</span><b>${money(bal)}</b></div>
        </div>
        ${f.budget > 0 ? `<div class="bar fund"><i style="width:${Math.min(100,pct(i,f.budget))}%"></i></div><p class="hint" style="margin:8px 0 14px">${pct(i,f.budget)}% of the budget set aside${f.budget > i ? ' · ' + money(f.budget - i) + ' still to add' : ''}</p>` : ''}
        ${bal < 0 ? `<p class="lead bad" style="font-size:16px">Spent ${money(-bal)} more than the fund holds. Add money to cover it.</p>` : ''}
        <form class="entry" data-form="fundtx"><input type="hidden" name="fundId" value="${f.id}">
          <label>Date<input type="date" name="date" required value="${todayStr()}"></label>
          <label>What happened<select name="kind"><option value="in">Add money to the fund</option><option value="out">Spend from the fund</option></select></label>
          <label>Amount (${esc(S.currency)})<input type="number" name="amount" required min="0.01" step="0.01" inputmode="decimal"></label>
          <label>Note<input name="note" placeholder="Optional"></label>
          <div class="actions"><button class="btn primary" type="submit">Save</button></div></form>
        ${tx.length ? `<details><summary>${tx.length} transaction${tx.length>1?'s':''}</summary><div class="tw"><table class="data"><tbody>
          ${tx.map(t => `<tr><td>${fmtDate(t.date)}</td><td>${t.kind === 'in' ? 'Added' : 'Spent'}</td><td>${esc(t.note)}</td><td class="r">${t.kind === 'in' ? '' : '−'}${money(t.amount)}</td><td class="r"><button class="linkbtn del" data-act="del-child" data-coll="fundTx" data-id="${t.id}">Delete</button></td></tr>`).join('')}
        </tbody></table></div></details>` : ''}
        <div class="actions" style="margin-top:12px"><button class="btn small" data-act="edit" data-type="fund" data-id="${f.id}">Edit fund</button><button class="btn small danger" data-act="del" data-type="fund" data-id="${f.id}">Delete fund</button></div>
      </section>`;
    }).join('');
    return `<section class="block"><h2>${it ? 'Edit project fund' : 'New project fund'}</h2>
      <form class="entry" data-form="fund"><input type="hidden" name="id" value="${it ? it.id : ''}">
        <label>Project name<input name="name" required placeholder="House renovation, wedding, school fees…" value="${esc(it ? it.name : '')}"></label>
        <label>Planned budget (${esc(S.currency)}, optional)<input type="number" name="budget" min="0" step="0.01" inputmode="decimal" value="${it ? it.budget || '' : ''}"></label>
        <label>Note (optional)<input name="note" value="${esc(it ? it.note || '' : '')}"></label>
        <div class="actions"><button class="btn primary" type="submit">${it ? 'Save changes' : 'Create fund'}</button>${it ? '<button class="btn" type="button" data-act="cancel-edit">Cancel</button>' : ''}</div>
      </form>
      <p class="hint">A project fund is money you set aside for one specific purpose. Money you add counts in that month's "set aside" line on the Overview. Money you spend from the fund does not reduce your monthly left-over a second time, because it was already set aside.</p></section>
      ${cards || '<div class="empty">No project funds yet. Create one above.</div>'}`;
  },

  savings(){
    const it = ui.edit && ui.edit.type === 'goal' ? S.goals.find(x => x.id === ui.edit.id) : null;
    const goals = S.goals.map(g => {
      const s = goalSaved(g), rem = Math.max(0, g.target - s);
      let need = '';
      if(rem === 0) need = 'Goal reached.';
      else if(g.deadline){
        const [y,mo] = g.deadline.split('-').map(Number);
        const months = (y - now.getFullYear()) * 12 + (mo - 1 - now.getMonth()) + 1;
        need = months >= 1 ? `Save about ${money(Math.ceil(rem / months))} a month to finish by ${monthName(g.deadline.slice(0,7))}.` : 'The target date has passed.';
      }
      const contribs = S.contribs.filter(c => c.goalId === g.id).sort((a,b) => b.date.localeCompare(a.date));
      return `<section class="block"><div class="line"><h2>${esc(g.name)}</h2><span>${money(s)} <span class="muted">of ${money(g.target)}</span></span></div>
        <div class="bar sav"><i style="width:${Math.min(100,pct(s,g.target))}%"></i></div>
        <p class="hint" style="margin:8px 0 12px">${pct(s,g.target)}% saved · ${money(rem)} to go${need ? ' · ' + need : ''}</p>
        <form class="entry" data-form="contrib"><input type="hidden" name="goalId" value="${g.id}">
          <label>Date<input type="date" name="date" required value="${todayStr()}"></label>
          <label>Amount (${esc(S.currency)})<input type="number" name="amount" required min="0.01" step="0.01" inputmode="decimal"></label>
          <div class="actions"><button class="btn primary" type="submit">Add contribution</button>
          <button class="btn small" type="button" data-act="edit" data-type="goal" data-id="${g.id}">Edit goal</button>
          <button class="btn small danger" type="button" data-act="del" data-type="goal" data-id="${g.id}">Delete goal</button></div></form>
        ${contribs.length ? `<details><summary>${contribs.length} contribution${contribs.length>1?'s':''}</summary><div class="tw"><table class="data"><tbody>
          ${contribs.map(c => `<tr><td>${fmtDate(c.date)}</td><td class="r">${money(c.amount)}</td><td class="r"><button class="linkbtn del" data-act="del-child" data-coll="contribs" data-id="${c.id}">Delete</button></td></tr>`).join('')}
        </tbody></table></div></details>` : ''}</section>`;
    }).join('');
    return `<section class="block"><h2>${it ? 'Edit savings goal' : 'New savings goal'}</h2>
      <form class="entry" data-form="goal"><input type="hidden" name="id" value="${it ? it.id : ''}">
        <label>Goal name<input name="name" required placeholder="Emergency fund" value="${esc(it ? it.name : '')}"></label>
        <label>Target (${esc(S.currency)})<input type="number" name="target" required min="1" step="0.01" inputmode="decimal" value="${it ? it.target : ''}"></label>
        <label>Already saved<input type="number" name="start" min="0" step="0.01" inputmode="decimal" value="${it ? it.start : 0}"></label>
        <label>Target date (optional)<input type="date" name="deadline" value="${it ? it.deadline || '' : ''}"></label>
        <div class="actions"><button class="btn primary" type="submit">${it ? 'Save changes' : 'Add goal'}</button>${it ? '<button class="btn" type="button" data-act="cancel-edit">Cancel</button>' : ''}</div>
      </form>
      <p class="hint">Contributions you log here count as money set aside in the month they are dated. For a one-off project with its own spending, use Project funds instead.</p></section>
      ${goals || '<div class="empty">No savings goals yet. Add one above.</div>'}`;
  },

  year(){
    const y = ui.year, rows = [];
    for(let i = 0; i < 12; i++){ const m = y + '-' + pad(i+1); rows.push({m, i, ...monthTotals(m)}); }
    const T = {inc:sum(rows,r=>r.inc), exp:sum(rows,r=>r.exp), loan:sum(rows,r=>r.loan), sav:sum(rows,r=>r.sav), proj:sum(rows,r=>r.proj), inv:sum(rows,r=>r.inv), invIn:sum(rows,r=>r.invIn)};
    T.left = T.inc - T.exp - T.loan - T.sav - T.proj - T.inv + T.invIn;
    const max = Math.max(1, ...rows.map(r => Math.max(r.inc, r.exp + r.loan)));
    const W = 720, H = 220, L = 8, B = 24, gw = (W - L) / 12;
    let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income compared with spending by month"><line x1="${L}" y1="${H-B}" x2="${W}" y2="${H-B}" stroke="currentColor" stroke-opacity=".25"/>`;
    rows.forEach(r => {
      const x = L + r.i * gw, bw = gw * .32, ih = r.inc / max * (H - B - 10), eh = (r.exp + r.loan) / max * (H - B - 10);
      svg += `<rect x="${x + gw*.14}" y="${H-B-ih}" width="${bw}" height="${ih}" rx="2" fill="var(--income)"><title>${shortMonth(r.i)} income ${money(r.inc)}</title></rect>`;
      svg += `<rect x="${x + gw*.14 + bw + 3}" y="${H-B-eh}" width="${bw}" height="${eh}" rx="2" fill="var(--expense)"><title>${shortMonth(r.i)} expenses and loan repayments ${money(r.exp + r.loan)}</title></rect>`;
      svg += `<text x="${x + gw/2}" y="${H-8}" text-anchor="middle">${shortMonth(r.i)}</text>`;
    });
    svg += '</svg>';

/* ================= Data merge (used by Drive sync) ================= */
function mergeState(a, b){
  const out = {...a};
  const tomb = {...(b.tomb || {})};
  Object.entries(a.tomb || {}).forEach(([k, v]) => { tomb[k] = Math.max(tomb[k] || 0, v); });
  COLS.forEach(c => {
    const map = new Map();
    [...(b[c] || []), ...(a[c] || [])].forEach(x => { const cur = map.get(x.id); if(!cur || (x.u || 0) >= (cur.u || 0)) map.set(x.id, x); });
    out[c] = [...map.values()].filter(x => !(tomb[x.id] >= (x.u || 0)));
  });
  const has = (c, id) => out[c].some(x => x.id === id);
  out.contribs = out.contribs.filter(x => has('goals', x.goalId));
  out.payments = out.payments.filter(x => has('loans', x.loanId));
  out.charges  = out.charges.filter(x => has('loans', x.loanId));
  out.fundTx   = out.fundTx.filter(x => has('funds', x.fundId));
  out.invtx    = out.invtx.filter(x => has('investments', x.invId));
  if((b.settingsU || 0) > (a.settingsU || 0)){ out.currency = b.currency; out.earners = b.earners; out.categories = b.categories; out.invFlow = b.invFlow; out.settingsU = b.settingsU; }
  out.tomb = tomb; out.v = 2;
  return out;
}

/* ================= Google Drive sync ================= */
const lsGet = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, v); }catch(e){} };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
const fileId = () => lsGet('hcf.fileId');
const apiKey = () => lsGet('hcf.apiKey') || GOOGLE_API_KEY || '';
let gToken = null, gExp = 0, pickerReady = false, syncTimer = null, syncing = false;
try{ const c = JSON.parse(sessionStorage.getItem('hcf.tok') || 'null'); if(c && c.t && Date.now() < c.e - 30000){ gToken = c.t; gExp = c.e; } }catch(e){}   // reuse a still-valid token after a refresh
const sync = {status:'idle', last:Number(lsGet('hcf.last')) || 0, msg:''};
const tokenValid = () => !!gToken && Date.now() < gExp - 30000;
function gapiReady(){ try{ gapi.load('picker', () => { pickerReady = true; }); }catch(e){} }

function requestToken(prompt){
  return new Promise((res, rej) => {
    if(!(window.google && google.accounts && google.accounts.oauth2)) return rej(new Error('Google sign-in is still loading. Try again in a moment.'));
    const c = google.accounts.oauth2.initTokenClient({
      client_id: G.clientId, scope: G.scope,
      callback: r => {
        if(r.error) return rej(new Error(r.error_description || r.error));
        gToken = r.access_token; gExp = Date.now() + (Number(r.expires_in) || 3600) * 1000; lsSet('hcf.was', '1');
        try{ sessionStorage.setItem('hcf.tok', JSON.stringify({t:gToken, e:gExp})); }catch(e){}
        res(gToken);
      },
      error_callback: e => rej(new Error((e && e.type) || 'Sign-in was cancelled'))
    });
    c.requestAccessToken({prompt});
  });
}
async function dfetch(url, opts = {}){
  if(!tokenValid()) throw new Error('needs-signin');
  const r = await fetch(url, {...opts, headers:{...(opts.headers || {}), Authorization:'Bearer ' + gToken}});
  if(r.status === 401){ gToken = null; try{ sessionStorage.removeItem('hcf.tok'); }catch(e){} throw new Error('needs-signin'); }
  if(!r.ok){
    const t = await r.text().catch(() => '');
    if(r.status === 404) throw new Error('This account cannot open the shared file. Use "Connect to a file shared with me" to pick it.');
    throw new Error('Drive error ' + r.status + ' ' + t.slice(0, 160));
  }
  return r;
}
function chipState(){
  if(!fileId()) return ['', 'Sync off'];
  if(sync.status === 'syncing') return ['busy', 'Syncing…'];
  if(sync.status === 'ok') return ['ok', 'Synced ' + new Date(sync.last).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})];
  if(sync.status === 'signin') return ['warn', 'Sign in to sync'];
  if(sync.status === 'error') return ['bad', 'Sync problem'];
  return ['warn', 'Connecting…'];
}
function renderChip(){
  const [cls, txt] = chipState(), el = document.getElementById('syncchip');
  if(!el) return; el.className = 'syncchip ' + cls; document.getElementById('synctext').textContent = txt;
}
async function syncNow(){
  const id = fileId(); if(!id || syncing) return;
  syncing = true; sync.status = 'syncing'; renderChip();
  try{
    const before = JSON.stringify(S);
    const txt = await (await dfetch('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media')).text();
    let remote = null; try{ remote = JSON.parse(txt); }catch(e){}
    if(remote) S = mergeState(S, normalize(remote));
    runAuto();
    saveLocal();
    await dfetch('https://www.googleapis.com/upload/drive/v3/files/' + id + '?uploadType=media', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(S)});
    sync.status = 'ok'; sync.last = Date.now(); sync.msg = ''; lsSet('hcf.last', String(sync.last));
    const ae = document.activeElement;
    if(JSON.stringify(S) !== before && !(ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && document.getElementById('app').contains(ae))) render();
  }catch(e){
    if(e.message === 'needs-signin') sync.status = 'signin'; else { sync.status = 'error'; sync.msg = e.message; }
  }
  syncing = false; renderChip(); if(ui.tab === 'setup' && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render();
}
function scheduleSync(){
  if(!fileId()) return;
  if(!tokenValid()){ sync.status = 'signin'; renderChip(); return; }
  clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 1500);
}
async function gSignIn(){
  try{ await requestToken('select_account'); if(fileId()) await syncNow(); render(); }
  catch(e){ toast(e.message); }
}
async function gCreate(){
  try{
    if(!tokenValid()) await requestToken('select_account');
    const f = await (await dfetch('https://www.googleapis.com/drive/v3/files', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name:G.fileName, mimeType:'application/json'})})).json();
    lsSet('hcf.fileId', f.id); await syncNow(); render(); toast('Shared file created in your Google Drive.');
  }catch(e){ toast(e.message); }
}
async function gShare(email){
  try{
    await dfetch('https://www.googleapis.com/drive/v3/files/' + fileId() + '/permissions?sendNotificationEmail=true', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({type:'user', role:'writer', emailAddress:email})});
    toast('Shared with ' + email + '. They now need to connect to it from their own sign-in.');
  }catch(e){ toast(e.message); }
}
async function gPick(){
  const key = apiKey();
  if(!key) return toast('Add the Google API key first (see the box below).');
  try{
    const tok = tokenValid() ? gToken : await requestToken('select_account');
    if(!pickerReady) throw new Error('The file picker is still loading. Try again in a moment.');
    const view = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setIncludeFolders(false).setOwnedByMe(false);
    new google.picker.PickerBuilder().addView(view).setOAuthToken(tok).setDeveloperKey(key).setAppId(G.appId).setTitle('Pick the shared household file')
      .setCallback(d => { if(d.action === google.picker.Action.PICKED){ lsSet('hcf.fileId', d.docs[0].id); syncNow().then(render); } }).build().setVisible(true);
  }catch(e){ toast(e.message); }
}
function gDisconnect(){
  if(!confirm('Stop syncing on this device? Your data stays here and in Drive.')) return;
  if(gToken && window.google) try{ google.accounts.oauth2.revoke(gToken, () => {}); }catch(e){}
  gToken = null; try{ sessionStorage.removeItem('hcf.tok'); }catch(e){} lsDel('hcf.fileId'); lsDel('hcf.was'); sync.status = 'idle'; render();
}
