const COLL = {income:'income', expense:'expenses', goal:'goals', loan:'loans', fund:'funds', investment:'investments'};
const CHILD = {goals:['contribs'], loans:['payments','charges'], funds:['fundTx'], investments:['invtx']};
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csvCell = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function exportCsv(){
  const head = ['type','date','category_or_name','person','description','amount'], rows = [];
  S.income.forEach(x => rows.push(['income', x.date, x.source, x.earner, x.note, x.amount]));
  S.expenses.forEach(x => rows.push(['expense', x.date, x.category, x.payer, x.desc, x.amount]));
  S.contribs.forEach(c => { const g = S.goals.find(x => x.id === c.goalId); rows.push(['savings', c.date, g ? g.name : '', '', '', c.amount]); });
  S.payments.forEach(p => { const l = S.loans.find(x => x.id === p.loanId); rows.push([p.kind === 'lump' ? 'loan lump sum' : 'loan repayment', p.date, l ? l.name : '', '', '', p.amount]); });
  S.charges.forEach(c => { const l = S.loans.find(x => x.id === c.loanId); rows.push(['loan interest charged', c.date, l ? l.name : '', '', c.note, c.amount]); });
  S.fundTx.forEach(t => { const f = S.funds.find(x => x.id === t.fundId); rows.push([t.kind === 'in' ? 'project fund added' : 'project fund spent', t.date, f ? f.name : '', '', t.note, t.amount]); });
  S.investments.forEach(i => { if(i.type === 'tbill'){ const T = tbillInfo(i); rows.push(['treasury bill bought', i.date, i.name, '', T.t + ' days', T.cost]); if(T.mat) rows.push(['treasury bill matures', T.mat, i.name, '', '', T.face]); } });
  S.invtx.forEach(t => { const i = S.investments.find(x => x.id === t.invId); rows.push(['investment ' + t.kind, t.date, i ? i.name : '', '', t.note || '', t.amount]); });
  rows.sort((a, b) => a[1].localeCompare(b[1]));
  download('household-entries.csv', [head, ...rows].map(r => r.map(csvCell).join(',')).join('\n'), 'text/csv');
}
function removeItem(coll, id){
  const t = Date.now();
  S[coll] = S[coll].filter(x => x.id !== id); S.tomb[id] = t;
  const key = {goals:'goalId', loans:'loanId', funds:'fundId', investments:'invId'}[coll];
  (CHILD[coll] || []).forEach(c => { S[c] = S[c].filter(x => { if(x[key] === id){ S.tomb[x.id] = t; return false; } return true; }); });
}
function copyPrev(type){
  const prev = shiftMonth(ui.month, -1), last = lastDay(ui.month), key = COLL[type];
  const src = S[key].filter(x => inMonth(x.date, prev));
  if(!src.length) return toast('Nothing recorded in ' + monthName(prev) + ' to copy.');
  if(!confirm('Copy ' + src.length + ' entr' + (src.length === 1 ? 'y' : 'ies') + ' from ' + monthName(prev) + ' into ' + monthName(ui.month) + '?')) return;
  src.forEach(x => S[key].push({...x, id:uid(), u:Date.now(), date:ui.month + '-' + pad(Math.min(Number(x.date.slice(8,10)), last))}));
  save(); render(); toast('Copied ' + src.length + ' entries.');
}
function loadSample(){

  [0,1,2].forEach(k => S.contribs.push({id:uid(), u:t, goalId:g.id, date:shiftMonth(curMonth,-k)+'-28', amount:100000}));

  [2,1,0].forEach(k => S.payments.push({id:uid(), u:t, loanId:l.id, date:shiftMonth(curMonth,-k)+'-05', amount:LM, kind:'monthly'}));

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id, type = b.dataset.type;
  if(a === 'tab' && b.id === 'syncchip' && fileId() && !tokenValid()) return gSignIn();
  if(a === 'tab') return go(b.dataset.tab);
  if(a === 'prev-month'){ ui.month = shiftMonth(ui.month, -1); ui.edit = null; return render(); }
  if(a === 'next-month'){ ui.month = shiftMonth(ui.month, 1); ui.edit = null; return render(); }
  if(a === 'prev-year'){ ui.year--; return render(); }
  if(a === 'next-year'){ ui.year++; return render(); }
  if(a === 'edit'){ ui.edit = {type, id}; render(); const f = document.querySelector('form[data-form]'); if(f) f.scrollIntoView({block:'center'}); return; }
  if(a === 'cancel-edit'){ ui.edit = null; return render(); }
  if(a === 'del'){
    const label = {income:'this income entry', expense:'this expense', goal:'this goal and its contributions', loan:'this loan and its payments', fund:'this fund and its transactions', investment:'this investment and its history'}[type];
    if(!confirm('Delete ' + label + '?')) return;
    removeItem(COLL[type], id); save(); render(); return toast('Deleted.');
  }
  if(a === 'del-child'){ if(!confirm('Delete this entry?')) return; S[b.dataset.coll] = S[b.dataset.coll].filter(x => x.id !== id); S.tomb[id] = Date.now(); save(); render(); return; }
  if(a === 'log-due'){ const l = S.loans.find(x => x.id === id); if(!l) return; const I = loanInfo(l); const aid = 'auto-' + l.id + '-' + curMonth; if(S.payments.some(p => p.id === aid)) return; upsert(S.payments, {loanId:l.id, date:todayStr(), amount:Math.round(Math.min(I.M, I.o) * 100) / 100, kind:'monthly'}); save(); render(); return toast('Logged ' + money(Math.min(I.M, I.o)) + ' for ' + l.name + '.'); }
  if(a === 'fix-rate'){ upsert(S.loans, {id, rper:'month'}); save(); render(); return toast('Rate switched to per month.'); }
  if(a === 'inv-type'){ ui.invType = type; ui.openKeys.add('invadd'); return render(); }
  if(a === 'inv-close'){ upsert(S.investments, {id, closed:todayStr()}); save(); render(); return toast('Marked as collected.'); }
  if(a === 'inv-reopen'){ upsert(S.investments, {id, closed:''}); save(); render(); return; }
  if(a === 'copy-prev') return copyPrev(type);
  if(a === 'sample') return loadSample();
  if(a === 'export-json') return download('household-cash-flow-backup.json', JSON.stringify(S, null, 2), 'application/json');
  if(a === 'export-csv') return exportCsv();
  if(a === 'reset'){ if(confirm('Erase all entries on this device? If Google Drive sync is on, the shared file is NOT erased and the data will come back on the next sync. Download a backup first if unsure.')){ S = defaults(); saveLocal(); render(); toast('Erased on this device.'); } return; }
  if(a === 'g-signin') return gSignIn();
  if(a === 'g-create') return gCreate();
  if(a === 'g-pick') return gPick();
  if(a === 'g-sync') return syncNow();
  if(a === 'g-disconnect') return gDisconnect();
});
document.addEventListener('change', e => {
  if(e.target.id === 'monthinput' && e.target.value){ ui.month = e.target.value; ui.edit = null; render(); }
  else if(e.target.id === 'catfilter'){ ui.catFilter = e.target.value; render(); }
  else if(e.target.id === 'mergefile' && e.target.files[0]){
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(!d || typeof d !== 'object' || !COLS.some(c => Array.isArray(d[c]))) throw new Error('bad');
        const count = st => COLS.reduce((t, c) => t + (st[c] || []).length, 0);
        const before = count(S), snap = JSON.stringify(S);
        S = mergeState(S, normalize(d)); save(); render();
        const added = count(S) - before, changed = JSON.stringify(S) !== snap;
        toast(added > 0 ? 'Added ' + added + ' new entr' + (added === 1 ? 'y' : 'ies') + '. Your other entries were not changed.' : changed ? 'Updated entries that were already in the tracker with the corrected values.' : 'Nothing new to add. These entries are already in the tracker.');
      }catch(err){ toast('That file is not a valid entries file for this tracker.'); }
      e.target.value = '';
    };
    rd.readAsText(e.target.files[0]);
  }
  else if(e.target.id === 'importfile' && e.target.files[0]){
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(!d || !Array.isArray(d.income) || !Array.isArray(d.expenses)) throw new Error('bad');
        if(!confirm('Replace the data on this device with the backup?')) return;
        S = normalize(d); save(); render(); toast('Backup restored.');
      }catch(err){ toast('That file is not a valid backup from this tracker.'); }
    };
    rd.readAsText(e.target.files[0]);
  }
});
document.addEventListener('toggle', e => { const el = e.target; if(el && el.tagName === 'DETAILS' && el.dataset.key){ el.open ? ui.openKeys.add(el.dataset.key) : ui.openKeys.delete(el.dataset.key); } }, true);
document.addEventListener('input', e => {
  const fi = e.target.closest && e.target.closest('form[data-form="inv"]');
  if(fi){ const el = document.getElementById('invpreview'); if(el) el.textContent = invPreviewText(Object.fromEntries(new FormData(fi))); return; }
  const f = e.target.closest && e.target.closest('form[data-form="loan"]');
  if(f){
    const d = Object.fromEntries(new FormData(f)), el = document.getElementById('loanpreview');
    if(el) el.textContent = loanPreviewText(amt(d.original), d.itype, annRate(d.rate, d.rper), amt(d.iamount), amt(d.tenure), amt(d.monthly));
    return;
  }
  const id = e.target.dataset && e.target.dataset.whatif; if(!id) return;
  const l = S.loans.find(x => x.id === id), out = document.getElementById('whatif-' + id), x = parseFloat(e.target.value);
  if(!l || !out) return;
  out.textContent = x > 0 ? whatIfText(l, x) : 'Type an amount to see how much sooner the loan would clear.';
});

const amt = v => { const n = parseFloat(v); return isFinite(n) ? n : NaN; };
function upsert(arr, obj){ obj.u = Date.now(); const i = obj.id ? arr.findIndex(x => x.id === obj.id) : -1; if(i >= 0) arr[i] = {...arr[i], ...obj}; else arr.push({...obj, id:uid()}); }

document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-form]'); if(!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)), kind = f.dataset.form, bad = 'Enter an amount above zero.';
  if(kind === 'income'){
    const a = amt(d.amount); if(!(a > 0)) return toast(bad);
    upsert(S.income, {id:d.id, date:d.date, earner:d.earner, source:d.source.trim(), amount:a, note:(d.note || '').trim()});
  } else if(kind === 'expense'){
    const a = amt(d.amount); if(!(a > 0)) return toast(bad);
    upsert(S.expenses, {id:d.id, date:d.date, category:d.category, desc:d.desc.trim(), payer:d.payer, amount:a});
  } else if(kind === 'goal'){
    const t = amt(d.target); if(!(t > 0)) return toast('Enter a target above zero.');
    upsert(S.goals, {id:d.id, name:d.name.trim(), target:t, start:amt(d.start) || 0, deadline:d.deadline || ''});
  } else if(kind === 'contrib'){
    const a = amt(d.amount); if(!(a > 0) || !S.goals.some(g => g.id === d.goalId)) return toast(bad);
    upsert(S.contribs, {goalId:d.goalId, date:d.date, amount:a});
  } else if(kind === 'loan'){
    const o = amt(d.original), itype = ITYPES[d.itype] ? d.itype : 'reducing', rate = d.rate || '', rper = d.rper === 'month' ? 'month' : 'year', rateA = annRate(rate, rper), iamount = amt(d.iamount) || 0;
    const n = Math.max(0, Math.round(amt(d.tenure)) || 0), start = d.start || '';
    if(!(o > 0)) return toast('Enter the original loan amount.');
    if(itype === 'total' && !(iamount > 0)) return toast('Enter the exact total interest, or choose another interest method.');
    const T = calcTerms(o, itype, rateA, iamount, n);
    let m = amt(d.monthly), mExact = m;
    if(!(m > 0)){ if(T){ mExact = T.M; m = Math.round(T.M * 100) / 100; } else return toast('Enter the monthly repayment, or the tenure so it can be calculated.'); }
    let made = Math.round(amt(d.made));
    if(!(made >= 0)) made = (n > 0 && start) ? Math.min(n, monthsBetween(start, d.asAt)) : 0;
    let bal = amt(d.balance);
    if(!(bal >= 0)){
      if(!T) return toast('Enter the outstanding balance, or the tenure so it can be calculated.');
      bal = Math.round((itype === 'reducing' ? schedBal(o, rateA, n, made, mExact) : Math.max(0, T.total - made * mExact)) * 100) / 100;
    }
    const prevL = d.id ? S.loans.find(x => x.id === d.id) : null;
    const bu = (!prevL || prevL.balance !== bal || prevL.asAt !== d.asAt) ? Date.now() : (prevL.bu || 0);
    upsert(S.loans, {id:d.id, name:d.name.trim(), original:o, monthly:m, balance:bal, asAt:d.asAt, bu, rate, rper, tenure:n, made, start, itype, iamount, auto:d.auto === 'yes', autoDay:Math.min(28, Math.max(1, Math.round(amt(d.autoDay)) || (d.asAt ? Number(d.asAt.slice(8, 10)) : 1)))});
    runAuto();
  } else if(kind === 'updbal'){
    const l = S.loans.find(x => x.id === d.loanId), bal = amt(d.balance); if(!l || !(bal >= 0)) return toast('Enter the outstanding balance.');
    const madeNow = (d.made === '' || d.made === undefined) ? loanInfo(l).made : Math.max(0, Math.round(amt(d.made)) || 0);
    upsert(S.loans, {id:l.id, balance:bal, asAt:d.asAt, bu:Date.now(), made:madeNow});
  } else if(kind === 'charge'){
    const a = amt(d.amount); if(!(a > 0) || !S.loans.some(x => x.id === d.loanId)) return toast('Enter an amount above zero.');
    upsert(S.charges, {loanId:d.loanId, date:d.date, amount:a, note:(d.note || '').trim()});
  } else if(kind === 'payment'){
    const a = amt(d.amount), l = S.loans.find(x => x.id === d.loanId); if(!l || !(a > 0)) return toast(bad);
    const before = loanInfo(l).months;
    if(d.kind !== 'lump'){ const aid = 'auto-' + l.id + '-' + d.date.slice(0, 7); if(S.payments.some(p => p.id === aid)){ S.payments = S.payments.filter(p => p.id !== aid); S.tomb[aid] = Date.now(); } }   // your own entry replaces the automatic one
    upsert(S.payments, {loanId:l.id, date:d.date, amount:a, kind:d.kind === 'lump' ? 'lump' : 'monthly'});
    if(d.kind === 'lump'){
      const after = loanInfo(l).months;
      save(); render();
      return toast(after === 0 ? 'Lump sum logged. This loan is now fully paid off.' : (isFinite(before) && isFinite(after) && before > after) ? 'Lump sum logged. Payoff moves about ' + (before - after) + ' month' + (before - after === 1 ? '' : 's') + ' sooner.' : 'Lump sum logged.');
    }
  } else if(kind === 'inv'){
    const type = IVTYPES[d.type] ? d.type : 'other', name = (d.name || '').trim();
    if(!name) return toast('Give the investment a name.');
    const prev = d.id ? S.investments.find(x => x.id === d.id) : null, stamp = Date.now();
    if(type === 'tbill'){
      const cost = amt(d.cost), tenor = Math.round(amt(d.tenor));
      if(!(cost > 0)) return toast('Enter the amount invested.');
      if(!(tenor > 0)) return toast('Enter the tenor in days, for example 91, 182 or 364.');
      upsert(S.investments, {id:d.id, type, name, date:d.date, tenor, cost, face:amt(d.face) || 0, rate:d.rate || '', rtype:d.rtype === 'yield' ? 'yield' : 'discount', closed:prev ? (prev.closed || '') : ''});
    } else if(type === 'stock'){
      if(prev) upsert(S.investments, {id:prev.id, name, ticker:(d.ticker || '').trim()});
      else {
        const un = amt(d.units), pr = amt(d.price), fee = amt(d.fee) || 0;
        if(!(un > 0) || !(pr > 0)) return toast('Enter the number of shares and the price per share.');
        const id = uid(); S.investments.push({id, u:stamp, type, name, ticker:(d.ticker || '').trim(), date:d.date});
        upsert(S.invtx, {invId:id, date:d.date, kind:'buy', units:un, price:pr, fee, amount:un * pr + fee});
      }
    } else if(type === 'property'){
      const price = amt(d.price); if(!(price > 0)) return toast('Enter the agreed price.');
      const base = {name, location:(d.location || '').trim(), size:(d.size || '').trim(), date:d.date, price, fees:amt(d.fees) || 0};
      if(prev) upsert(S.investments, {id:prev.id, ...base});
      else {
        const id = uid(); S.investments.push({id, u:stamp, type, ...base});
        const paid = amt(d.paid) || 0, vn = amt(d.valueNow) || 0;
        if(paid > 0) upsert(S.invtx, {invId:id, date:d.date, kind:'pay', amount:paid, note:'Paid so far'});
        if(vn > 0) upsert(S.invtx, {invId:id, date:todayStr(), kind:'value', amount:vn, note:'Opening value'});
      }
    } else {
      if(prev) upsert(S.investments, {id:prev.id, name, date:d.date});
      else {
        const cost = amt(d.cost); if(!(cost > 0)) return toast('Enter the amount invested.');
        const id = uid(); S.investments.push({id, u:stamp, type:'other', name, date:d.date});
        upsert(S.invtx, {invId:id, date:d.date, kind:'pay', amount:cost, note:'Amount invested'});
        const vn = amt(d.valueNow) || 0; if(vn > 0) upsert(S.invtx, {invId:id, date:todayStr(), kind:'value', amount:vn, note:'Opening value'});
      }
    }
  } else if(kind === 'invtx'){
    const inv = S.investments.find(x => x.id === d.invId); if(!inv) return;
    const k = d.kind, note = (d.note || '').trim();
    if(k === 'buy' || k === 'sell'){
      const un = amt(d.units), pr = amt(d.price), fee = amt(d.fee) || 0;
      if(!(un > 0) || !(pr >= 0)) return toast('Enter the number of shares and the price per share.');
      if(k === 'sell' && un > stockInfo(inv).units + 1e-9) return toast('You only hold ' + stockInfo(inv).units + ' shares.');
      upsert(S.invtx, {invId:inv.id, date:d.date, kind:k, units:un, price:pr, fee, amount:k === 'buy' ? un * pr + fee : un * pr - fee, note});
    } else if(k === 'price'){
      const pr = amt(d.price); if(!(pr >= 0)) return toast('Enter the price per share.');
      upsert(S.invtx, {invId:inv.id, date:d.date, kind:'price', price:pr, amount:0, note});
    } else {
      const a = amt(d.amount); if(!(a > 0)) return toast(bad);
      upsert(S.invtx, {invId:inv.id, date:d.date, kind:k, amount:a, note});
    }
  } else if(kind === 'fund'){
    upsert(S.funds, {id:d.id, name:d.name.trim(), budget:amt(d.budget) || 0, note:(d.note || '').trim()});
  } else if(kind === 'fundtx'){
    const a = amt(d.amount); if(!(a > 0) || !S.funds.some(x => x.id === d.fundId)) return toast(bad);
    upsert(S.fundTx, {fundId:d.fundId, date:d.date, kind:d.kind === 'out' ? 'out' : 'in', amount:a, note:(d.note || '').trim()});
  } else if(kind === 'setup'){
    S.currency = d.currency.trim() || '₦';
    S.earners = d.earners.split('\n').map(s => s.trim()).filter(Boolean); if(!S.earners.length) S.earners = ['Me'];
    S.categories = d.categories.split('\n').map(s => s.trim()).filter(Boolean).map(line => { const [n, b] = line.split('|'); return {name:n.trim(), budget:amt((b || '').replace(/,/g, '')) || 0}; }).filter(c => c.name);
    if(!S.categories.length) S.categories = [{name:'Other', budget:0}];
    S.invFlow = d.invflow !== 'no';
    S.settingsU = Date.now(); save(); render(); return toast('Setup saved.');
  } else if(kind === 'share'){ return gShare(d.email.trim());
  } else if(kind === 'apikey'){ const k = (d.key || '').trim(); if(k) lsSet('hcf.apiKey', k); else lsDel('hcf.apiKey'); render(); return toast(k ? 'API key saved on this device.' : 'API key cleared.'); }
  ui.edit = null; save(); render(); toast('Saved.');
});

/* Keep devices in step: refresh when the tab is opened again, and every couple of minutes while open. */
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && runAuto()){ saveLocal(); render(); }
   if(document.visibilityState === 'visible' && fileId()){ tokenValid() ? syncNow() : armSilent(); } });
setInterval(() => { if(document.visibilityState === 'visible' && fileId() && tokenValid()) syncNow(); }, 120000);
async function trySilent(){
  if(!fileId() || !lsGet('hcf.was')) return;
  try{ await requestToken(''); await syncNow(); }catch(e){ sync.status = 'signin'; renderChip(); }
}
/* A browser only lets Google's sign-in window open after a tap or key press. So when there is no valid token,
   the first tap anywhere on the page renews it quietly (no account picker if you are already signed in to Google). */
let silentArmed = false;
function armSilent(){
  if(silentArmed || !fileId() || tokenValid()) return; silentArmed = true;
  const go = () => { document.removeEventListener('pointerdown', go, true); document.removeEventListener('keydown', go, true); silentArmed = false; if(fileId() && !tokenValid()) trySilent(); };
  document.addEventListener('pointerdown', go, true); document.addEventListener('keydown', go, true);
}
window.addEventListener('load', () => {
  if(!fileId()) return;
  if(tokenValid()){ syncNow(); } else { sync.status = 'signin'; renderChip(); armSilent(); }
});

if(runAuto()) saveLocal();
render();
</script>
